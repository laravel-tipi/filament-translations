# vendor/bin/testbench workbench:build && vendor/bin/testbench serve
# Sign in at /admin/login as editor@example.com / password.
laravel: '@testbench'

providers:
  - RyanChandler\BladeCaptureDirective\BladeCaptureDirectiveServiceProvider
  - BladeUI\Heroicons\BladeHeroiconsServiceProvider
  - BladeUI\Icons\BladeIconsServiceProvider
  - Livewire\LivewireServiceProvider
  - Filament\Support\SupportServiceProvider
  - Filament\Actions\ActionsServiceProvider
  - Filament\Forms\FormsServiceProvider
  - Filament\Infolists\InfolistsServiceProvider
  - Filament\Notifications\NotificationsServiceProvider
  - Filament\Schemas\SchemasServiceProvider
  - Filament\Tables\TablesServiceProvider
  - Filament\Widgets\WidgetsServiceProvider
  - Filament\FilamentServiceProvider
  - Tipi\Localization\LocalizationServiceProvider
  - Tipi\Translations\TranslationsServiceProvider
  - Tipi\Translations\Filament\FilamentTranslationsServiceProvider
  - Tipi\Translations\Filament\Tests\Fixtures\WorkbenchServiceProvider
  - Tipi\Translations\Filament\Tests\Fixtures\AdminPanelProvider
  - Tipi\Translations\Filament\Tests\Fixtures\PartnersPanelProvider

migrations:
  - vendor/orchestra/testbench-core/laravel/migrations
  - vendor/laravel-tipi/localization/database/migrations
  - vendor/laravel-tipi/translations/database/migrations
  - tests/Fixtures/migrations

workbench:
  start: /admin
  install: false
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh:
        --seed: true
        --seeder: Tipi\Translations\Filament\Tests\Fixtures\WorkbenchSeeder
  assets:
    - filament-assets
